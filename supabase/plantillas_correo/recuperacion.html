<!-- Supabase › Authentication › Emails › Reset password. Asunto sugerido: Crea o cambia tu contraseña de Operación BEL -->
<div style="font-family:Arial,Helvetica,sans-serif;background:#efefed;padding:24px">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden">
    <div style="background:#232c4b;padding:24px;color:#ffffff">
      <div style="font-size:11px;letter-spacing:3px">OPERACIÓN</div>
      <div style="font-size:32px;font-weight:900;color:#fddb16">BEL</div>
    </div>
    <div style="padding:24px;color:#1f2b3f;font-size:15px;line-height:1.5">
      <p>Recibimos una solicitud para crear o cambiar tu contraseña de <strong>Operación BEL</strong>.</p>
      <p style="text-align:center;margin:28px 0">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
           style="background:#fddb16;color:#1f2b3f;font-weight:bold;text-decoration:none;padding:14px 28px;border-radius:999px;display:inline-block">Crear nueva contraseña</a>
      </p>
      <p style="font-size:13px;color:#555">El enlace vence en 1 hora y funciona una sola vez. Si no lo pediste, ignora este correo: tu contraseña no cambia.</p>
    </div>
  </div>
</div>
